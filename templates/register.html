{% extends 'base.html' %}{% block title %}Register Team • SICM{% endblock %}{% block content %}<div class="auth-wrap"><div class="card auth-card"><span class="eyebrow">Team registration</span><h1 class="mt-3">Claim your team.</h1><p class="text-muted-custom">Each IPL team can be registered only once. After registration, the account can be used for multiple logins.</p><form method="post" class="mt-4"><label class="form-label">Participant name</label><input name="name" class="form-control mb-3" placeholder="Your name" required><label class="form-label">College</label><input name="college" class="form-control mb-3" placeholder="College / institution" required><label class="form-label">Team</label><select name="team" class="form-select mb-3" required><option value="">Select team</option>{% for t in teams %}<option value="{{t}}">{{t}}</option>{% endfor %}</select><label class="form-label">Team password</label><input name="password" type="password" minlength="6" class="form-control mb-3" placeholder="At least 6 characters" required><button class="btn btn-primary w-100">Register team</button></form><div class="text-center mt-3"><span class="mini-note">Already registered?</span> <a href="{{url_for('login')}}" class="text-white">Login</a></div></div></div>{% endblock %}
