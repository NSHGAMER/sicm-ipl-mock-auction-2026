{% extends "base.html" %}

{% block title %}Participant Login — IPL Auction{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="btn btn-link mb-3">&larr; Back</a>

<div class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
  <h4 class="mb-3 text-center">🔑 Participant Login</h4>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Team</label>
      <select name="team" class="form-select" required>
        <option value="">Choose</option>
        {% for t in teams %}
          <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <button class="btn btn-success w-100">Login</button>
  </form>
</div>
{% endblock %}
