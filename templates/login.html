{% extends 'base.html' %}{% block title %}Team Login • SICM{% endblock %}{% block content %}<div class="auth-wrap"><div class="card auth-card"><span class="eyebrow">Participant access</span><h1 class="mt-3">Welcome back.</h1><p class="text-muted-custom">Choose your registered team and enter its password.</p><form method="post" class="mt-4"><label class="form-label">Team</label><select name="team" class="form-select mb-3" required><option value="">Select team</option>{% for t in teams %}<option value="{{t}}">{{t}}</option>{% endfor %}</select><label class="form-label">Password</label><input name="password" type="password" class="form-control mb-3" placeholder="Your team password" required><button class="btn btn-primary w-100">Login to my team</button></form><div class="text-center mt-3"><span class="mini-note">Not registered?</span> <a href="{{url_for('register')}}" class="text-white">Register your team</a></div></div></div>{% endblock %}
